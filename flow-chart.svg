<svg width="680" viewBox="0 0 680 876" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The Project Flow</title>
<desc>Flow chart: /flow routes into a funnel of stages 0-3, a loop of stages 4-7 feeding back to stage 3, ending at okf. The design lane rides stages 2, 4 and 5. Three wrappers sit outside the sequence.</desc>
<style>
  svg { background:#FAFAF7; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .hd { font-size:14px; font-weight:600; fill:#444441; }
  .tt { font-size:14px; font-weight:600; }
  .ts { font-size:12px; }
  .note { font-size:12px; fill:#5F5E5A; }
  .rg { fill:none; stroke:#B4B2A9; stroke-width:0.75; stroke-dasharray:4 4; }
  .arr { stroke:#5F5E5A; stroke-width:1.5; fill:none; }
  .leader { stroke:#888780; stroke-width:1; fill:none; stroke-dasharray:3 4; }
  .n-teal rect { fill:#E1F5EE; stroke:#0F6E56; stroke-width:0.75; }
  .n-teal .tt { fill:#085041; } .n-teal .ts { fill:#0F6E56; }
  .n-purple rect { fill:#EEEDFE; stroke:#534AB7; stroke-width:0.75; }
  .n-purple .tt { fill:#3C3489; } .n-purple .ts { fill:#534AB7; }
  .n-coral rect { fill:#FAECE7; stroke:#993C1D; stroke-width:0.75; }
  .n-coral .tt { fill:#712B13; } .n-coral .ts { fill:#993C1D; }
  .n-gray rect { fill:#F1EFE8; stroke:#5F5E5A; stroke-width:0.75; }
  .n-gray .tt { fill:#2C2C2A; } .n-gray .ts { fill:#5F5E5A; }
  .n-wrap rect { fill:#FFFFFF; stroke:#B4B2A9; stroke-width:0.75; stroke-dasharray:4 4; }
  .n-wrap .tt { fill:#444441; } .n-wrap .ts { fill:#5F5E5A; }
  @media (prefers-color-scheme: dark) {
    svg { background:#141413; }
    .hd { fill:#D3D1C7; }
    .note { fill:#B4B2A9; }
    .rg { stroke:#5F5E5A; }
    .arr { stroke:#B4B2A9; }
    .leader { stroke:#888780; }
    .n-teal rect { fill:#04342C; stroke:#5DCAA5; }
    .n-teal .tt { fill:#9FE1CB; } .n-teal .ts { fill:#5DCAA5; }
    .n-purple rect { fill:#26215C; stroke:#AFA9EC; }
    .n-purple .tt { fill:#CECBF6; } .n-purple .ts { fill:#AFA9EC; }
    .n-coral rect { fill:#4A1B0C; stroke:#F0997B; }
    .n-coral .tt { fill:#F5C4B3; } .n-coral .ts { fill:#F0997B; }
    .n-gray rect { fill:#2C2C2A; stroke:#888780; }
    .n-gray .tt { fill:#F1EFE8; } .n-gray .ts { fill:#B4B2A9; }
    .n-wrap rect { fill:#1D1D1B; stroke:#5F5E5A; }
    .n-wrap .tt { fill:#D3D1C7; } .n-wrap .ts { fill:#888780; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="n-gray">
  <rect x="220" y="20" width="240" height="56" rx="8"/>
  <text class="tt" x="340" y="38" text-anchor="middle" dominant-baseline="central">/flow: the front door</text>
  <text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">diagnose the stage, route in</text>
</g>
<line x1="340" y1="76" x2="340" y2="108" class="arr" marker-end="url(#arrow)"/>
<text class="note" x="530" y="36" text-anchor="start">routes anywhere</text>
<path d="M460 48 L630 48 L630 328" class="leader" marker-end="url(#arrow)"/>

<rect x="40" y="110" width="600" height="196" rx="8" class="rg"/>
<text class="hd" x="60" y="132" text-anchor="start">Funnel: once per feature</text>
<g class="n-teal">
  <rect x="60" y="148" width="270" height="56" rx="8"/>
  <text class="tt" x="195" y="166" text-anchor="middle" dominant-baseline="central">0 · decision-council</text>
  <text class="ts" x="195" y="184" text-anchor="middle" dominant-baseline="central">optional · opens the space</text>
</g>
<g class="n-teal">
  <rect x="350" y="148" width="270" height="56" rx="8"/>
  <text class="tt" x="485" y="166" text-anchor="middle" dominant-baseline="central">1 · grill-me</text>
  <text class="ts" x="485" y="184" text-anchor="middle" dominant-baseline="central">interview until decisions lock</text>
</g>
<line x1="330" y1="176" x2="348" y2="176" class="arr" marker-end="url(#arrow)"/>
<path d="M485 204 L485 219 L195 219 L195 232" class="arr" marker-end="url(#arrow)"/>
<g class="n-teal">
  <rect x="60" y="234" width="270" height="56" rx="8"/>
  <text class="tt" x="195" y="252" text-anchor="middle" dominant-baseline="central">2 · write-a-prd ◆</text>
  <text class="ts" x="195" y="270" text-anchor="middle" dominant-baseline="central">the spec, from decisions</text>
</g>
<g class="n-teal">
  <rect x="350" y="234" width="270" height="56" rx="8"/>
  <text class="tt" x="485" y="252" text-anchor="middle" dominant-baseline="central">3 · to-tickets</text>
  <text class="ts" x="485" y="270" text-anchor="middle" dominant-baseline="central">slices, tiers, blocking edges</text>
</g>
<line x1="330" y1="262" x2="348" y2="262" class="arr" marker-end="url(#arrow)"/>
<line x1="485" y1="290" x2="485" y2="328" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="330" width="600" height="196" rx="8" class="rg"/>
<text class="hd" x="60" y="352" text-anchor="start">Loop: until qa comes back clean</text>
<g class="n-purple">
  <rect x="60" y="368" width="270" height="56" rx="8"/>
  <text class="tt" x="195" y="386" text-anchor="middle" dominant-baseline="central">4 · implement + tdd ◆</text>
  <text class="ts" x="195" y="404" text-anchor="middle" dominant-baseline="central">build one ticket green</text>
</g>
<g class="n-purple">
  <rect x="350" y="368" width="270" height="56" rx="8"/>
  <text class="tt" x="485" y="386" text-anchor="middle" dominant-baseline="central">5 · code-review ◆</text>
  <text class="ts" x="485" y="404" text-anchor="middle" dominant-baseline="central">correctness + design audit</text>
</g>
<line x1="330" y1="396" x2="348" y2="396" class="arr" marker-end="url(#arrow)"/>
<line x1="485" y1="424" x2="485" y2="452" class="arr" marker-end="url(#arrow)"/>
<g class="n-purple">
  <rect x="350" y="454" width="270" height="56" rx="8"/>
  <text class="tt" x="485" y="472" text-anchor="middle" dominant-baseline="central">6 · qa</text>
  <text class="ts" x="485" y="490" text-anchor="middle" dominant-baseline="central">use it, report bugs</text>
</g>
<g class="n-purple">
  <rect x="60" y="454" width="270" height="56" rx="8"/>
  <text class="tt" x="195" y="472" text-anchor="middle" dominant-baseline="central">7 · triage</text>
  <text class="ts" x="195" y="490" text-anchor="middle" dominant-baseline="central">route each issue onward</text>
</g>
<line x1="350" y1="482" x2="332" y2="482" class="arr" marker-end="url(#arrow)"/>
<text class="note" x="195" y="540" text-anchor="middle">↻ tickets re-enter at stage 3</text>

<path d="M485 510 L485 536 L340 536 L340 554" class="arr" marker-end="url(#arrow)"/>
<g class="n-gray">
  <rect x="220" y="556" width="240" height="56" rx="8"/>
  <text class="tt" x="340" y="574" text-anchor="middle" dominant-baseline="central">8 · okf</text>
  <text class="ts" x="340" y="592" text-anchor="middle" dominant-baseline="central">record what it taught</text>
</g>

<rect x="40" y="632" width="600" height="132" rx="8" class="rg"/>
<text class="hd" x="60" y="654" text-anchor="start">◆ Design lane: taste-skill rides stages 2 · 4 · 5</text>
<g class="n-coral">
  <rect x="60" y="668" width="170" height="56" rx="8"/>
  <text class="tt" x="145" y="686" text-anchor="middle" dominant-baseline="central">2 · define</text>
  <text class="ts" x="145" y="704" text-anchor="middle" dominant-baseline="central">imagegen mockups</text>
</g>
<g class="n-coral">
  <rect x="255" y="668" width="170" height="56" rx="8"/>
  <text class="tt" x="340" y="686" text-anchor="middle" dominant-baseline="central">2→4 · validate</text>
  <text class="ts" x="340" y="704" text-anchor="middle" dominant-baseline="central">route by surface</text>
</g>
<g class="n-coral">
  <rect x="450" y="668" width="170" height="56" rx="8"/>
  <text class="tt" x="535" y="686" text-anchor="middle" dominant-baseline="central">5 · audit</text>
  <text class="ts" x="535" y="704" text-anchor="middle" dominant-baseline="central">redesign-skill audit</text>
</g>
<text class="note" x="340" y="744" text-anchor="middle">house design language always wins · presets are explicit-invoke</text>

<text class="hd" x="40" y="792" text-anchor="start">Wrappers: never in the sequence</text>
<g class="n-wrap">
  <rect x="40" y="804" width="190" height="56" rx="8"/>
  <text class="tt" x="135" y="822" text-anchor="middle" dominant-baseline="central">unlazy</text>
  <text class="ts" x="135" y="840" text-anchor="middle" dominant-baseline="central">gates wrap stages 4–5</text>
</g>
<g class="n-wrap">
  <rect x="245" y="804" width="190" height="56" rx="8"/>
  <text class="tt" x="340" y="822" text-anchor="middle" dominant-baseline="central">switchboard</text>
  <text class="ts" x="340" y="840" text-anchor="middle" dominant-baseline="central">routes tickets by tier</text>
</g>
<g class="n-wrap">
  <rect x="450" y="804" width="190" height="56" rx="8"/>
  <text class="tt" x="545" y="822" text-anchor="middle" dominant-baseline="central">standing context</text>
  <text class="ts" x="545" y="840" text-anchor="middle" dominant-baseline="central">read at stages 2 + 4</text>
</g>
</svg>
